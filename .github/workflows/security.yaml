# security.yaml — Phase 1 (scanning) + Phase 2 (supply chain: SBOM + signing)
name: Security Scan and Sign
on:
  push:
    branches:
      - main

# OIDC permission is REQUIRED for keyless signing — this is how GitHub
# proves the workflow's identity to Sigstore without any stored keys
permissions:
  contents: read
  packages: write      # push image to GHCR
  id-token: write      # OIDC token for keyless signing

jobs:
  # ---- PHASE 1 SCANNERS (unchanged) ----
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect --source /repo --verbose --redact

  sast-scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep scan --config p/default --error \
            --exclude-rule python.flask.security.audit.app-run-param-config.avoid_app_run_with_bad_host \
            --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

  # ---- BUILD, PUSH, SCAN, SBOM, SIGN, ATTEST ----
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Log in to GHCR so we can push
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build AND push, capturing the image DIGEST (immutable, what we sign)
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/trobertsn/secure-app:${{ github.sha }}

      # Scan the pushed image with Trivy (Phase 1, now on the real registry image)
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ghcr.io/trobertsn/secure-app@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Install cosign (signing) and syft (SBOM)
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      # Generate the SBOM — full inventory of everything in the image
      - name: Generate SBOM
        run: |
          syft ghcr.io/trobertsn/secure-app@${{ steps.build.outputs.digest }} \
            -o spdx-json > sbom.spdx.json
          echo "SBOM generated:"
          cat sbom.spdx.json | head -20

      # Sign the image DIGEST (keyless — uses GitHub OIDC, no stored keys)
      - name: Sign image
        run: |
          cosign sign --yes \
            ghcr.io/trobertsn/secure-app@${{ steps.build.outputs.digest }}

      # Attest the SBOM — cryptographically bind it to the image
      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate sbom.spdx.json \
            ghcr.io/trobertsn/secure-app@${{ steps.build.outputs.digest }}