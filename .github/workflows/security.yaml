# security.yaml — Phase 1 DevSecOps pipeline: shift-left scanning
name: Security Scan
on:
  push:
    branches:
      - main
jobs:
  # ---- SCANNER 1: Gitleaks ----
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect --source /repo --verbose --redact

  # ---- SCANNER 2: Semgrep (SAST) ----
  sast-scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Semgrep
        # --config p/default is the ruleset.
        # We exclude the two accepted findings (see notes below) so the scan
        # reflects only issues we intend to act on. This is documented triage,
        # not silencing — each exclusion has a reason.
        run: |
          semgrep scan --config p/default --error \
            --exclude-rule python.flask.security.audit.app-run-param-config.avoid_app_run_with_bad_host \
            --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

  # ---- SCANNER 3: Trivy ----
  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t secure-app:test .
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: secure-app:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true      # only fail on vulns that HAVE a fix available
          exit-code: "1"
          format: table