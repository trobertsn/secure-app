# security.yaml — Phase 1 DevSecOps pipeline: shift-left scanning
# Three scanners run on every push: secrets, code (SAST), dependencies/image
name: Security Scan
on:
  push:
    branches:
      - main
jobs:
  # ---- SCANNER 1: Gitleaks (call the CLI directly — current best practice) ----
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        # run the gitleaks binary directly in its container; scan the full repo
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect --source /repo --verbose --redact

  # ---- SCANNER 2: Semgrep (SAST) — current container approach, not the deprecated action ----
  sast-scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config p/default --error

  # ---- SCANNER 3: Trivy — scan the built image so it sees installed packages ----
  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t secure-app:test .
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: secure-app:test
          severity: HIGH,CRITICAL
          exit-code: "1"        # FAIL the job if HIGH/CRITICAL vulns are found
          format: table